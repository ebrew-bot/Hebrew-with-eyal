<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build It! · Hebrew Decoding</title>
<style>
:root{--blue:#3157a4;--blue2:#5476bd;--purple:#7357d8;--ink:#26324a;--muted:#71809a;--cream:#fffaf0;--sky:#eef7ff;--line:#dbe6f4;--green:#e5f7eb;--greenline:#79c992;--red:#fff0f0;--redline:#e69696;--yellow:#fff3c8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;background:linear-gradient(180deg,var(--sky),#f8fbff 48%,var(--cream))}
.page{max-width:780px;margin:auto;padding:10px 16px 24px}.hero{text-align:center;margin-bottom:10px}.kicker{display:inline-block;padding:5px 12px;border-radius:999px;background:#e8f0ff;color:var(--blue);font-size:12px;font-weight:800}
h1{margin:6px 0 2px;color:var(--blue);font-size:30px}.he-title{direction:rtl;color:var(--purple);font-weight:800;font-size:19px}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.game{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:14px 18px;box-shadow:0 10px 28px rgba(49,87,164,.09)}
.status{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:800}.badge{background:#eeeaff;color:var(--purple);padding:5px 10px;border-radius:999px}
.track{height:9px;background:#edf1f7;border-radius:999px;margin:8px 0 12px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue2),var(--purple));transition:width .25s}
.question{text-align:center;background:#f8fbff;border:1px solid #e6edf8;border-radius:19px;padding:13px;margin-bottom:11px}.prompt{font-size:14px;font-weight:800;color:var(--muted)}
.target{font-size:27px;color:var(--blue);font-weight:900;margin:5px}.mini{font-size:12px;color:var(--muted)}
.answer{min-height:86px;border:2px dashed #cdd9ec;border-radius:18px;background:#fcfdff;display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;margin-bottom:11px;direction:rtl}
.placeholder{color:#a4afbd;font-weight:800;font-size:14px}.piece{border:2px solid #ded7f7;border-radius:14px;background:#f7f4ff;color:var(--purple);font-size:31px;font-weight:900;min-width:76px;padding:11px 13px;cursor:pointer;direction:rtl}
.answer .piece{background:#fff;border-color:#b9c9e5}.pieces{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;padding:5px}
.actions{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:13px;padding:11px;font-weight:800;cursor:pointer}.clear{background:#eef2f8;color:var(--blue);flex:1}.check{background:var(--blue);color:#fff;flex:2}.feedback{display:none;margin-top:9px;padding:9px 12px;border-radius:15px;text-align:center;font-size:14px;font-weight:800}.feedback.show{display:block}.good{background:var(--green)}.bad{background:var(--red)}
.next{display:none;width:100%;border:0;border-radius:15px;margin-top:8px;padding:11px;background:var(--purple);color:white;font-size:16px;font-weight:800}.next.show{display:block}
.done{text-align:center;padding:18px 5px}.done h2{color:var(--blue)}.score{font-size:46px;font-weight:900;color:var(--purple)}.play{width:100%;border:0;border-radius:15px;padding:13px;background:var(--blue);color:#fff;font-weight:800;font-size:16px}
.note{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}
@media(max-width:520px){.page{padding:8px 10px}.game{padding:12px}.piece{font-size:27px;min-width:65px;padding:10px}.target{font-size:23px}}
</style></head>
<body><main class="page">
<header class="hero"><div class="kicker">MID-LEVEL · DECODING</div><h1>Build It!</h1><div class="he-title">בונים וקוראים</div><div class="sub">Build the unfamiliar word from its sound chunks.</div></header>
<section class="game" id="game">
<div class="status"><span id="count"></span><span class="badge" id="level"></span></div><div class="track"><div class="fill" id="fill"></div></div>
<div class="question"><div class="prompt">Build the Hebrew that says:</div><div class="target" id="target"></div><div class="mini" id="mini"></div></div>
<div class="answer" id="answer"><span class="placeholder">Your word will appear here</span></div>
<div class="pieces" id="pieces"></div>
<div class="actions"><button class="btn clear" id="clear">Clear ↻</button><button class="btn check" id="check">Check My Word</button></div>
<div class="feedback" id="feedback"></div><button class="next" id="next">Next →</button>
<div class="note">Tap the chunks in reading order. Tap a chunk in your answer to return it.</div>
</section></main>
<script>
const bank=[
{tier:1,target:"MALON",chunks:["מָ","לוֹן"],extras:["מֶ","לִין"]},
{tier:1,target:"SHUVAH",chunks:["שׁוּ","בָה"],extras:["שׁוֹ","בֶה"]},
{tier:1,target:"GUREM",chunks:["גּוּ","רֶם"],extras:["גּוֹ","רָם"]},
{tier:1,target:"TOLI",chunks:["תּוֹ","לִי"],extras:["תּוּ","לֵי"]},

{tier:2,target:"CHALUMAH",chunks:["חֲ","לוּ","מָה"],extras:["חֶ","לוֹ","מֶה"]},
{tier:2,target:"TZARIV",chunks:["צָ","רִיב"],extras:["צֶ","רֵב","סָ"]},
{tier:2,target:"BRIMOT",chunks:["בְּ","רִי","מוֹת"],extras:["בֶּ","רֵי","מוּת"]},
{tier:2,target:"SGARUNAH",chunks:["סְ","גָ","רוּ","נָה"],extras:["סֶ","גוֹ","רֹ","נֶה"]},

{tier:3,target:"PLUMARIM",chunks:["פְּ","לוּ","מָ","רִים"],extras:["פֶּ","לוֹ","מֶ","רֵם"]},
{tier:3,target:"TZMURAKET",chunks:["צְ","מוּ","רָ","קֶת"],extras:["צֶ","מוֹ","רֶ","קָת"]},
{tier:3,target:"KRAFNU-LIM",chunks:["כְּ","רַ","פְ","נוּ","לִים"],extras:["כֶּ","רָ","פֶ","נוֹ"]},
{tier:3,target:"SHLUMVARIT",chunks:["שְׁ","לוּמ","בָ","רִית"],extras:["שֶׁ","לוֹמ","בֶ","רֵית"]},

{tier:4,target:"MITROKSHIM",chunks:["מִתְ","רוֹקְ","שִׁים"],extras:["מֶתְ","רוּקְ","שֵׁם"]},
{tier:4,target:"PRANUMELET",chunks:["פְּרָ","נוּ","מֶ","לֶת"],extras:["פֶּרָ","נוֹ","מָ","לָת"]},
{tier:4,target:"TZMURANIT",chunks:["צְמוּ","רָ","נִית"],extras:["צֶמוּ","רוֹ","נֵית"]},
{tier:4,target:"KREMULAV",chunks:["כְּרֶ","מוּ","לָב"],extras:["כָּרֶ","מוֹ","לֶב"]}
];
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeRound(){let r=[];[1,2,3,4].forEach(t=>r.push(...sh(bank.filter(x=>x.tier===t)).slice(0,t<3?3:2)));return r}
let qs=makeRound(),i=0,score=0,selected=[],locked=false;const $=x=>document.getElementById(x);const labels={1:"Warm Up",2:"Level Up",3:"Challenge",4:"Final Challenge"};
function render(){
 locked=false;selected=[];let q=qs[i];$("count").textContent=`${i+1} of ${qs.length}`;$("level").textContent=labels[q.tier];$("fill").style.width=`${i/qs.length*100}%`;$("target").textContent=q.target;$("mini").textContent=q.tier>=3?"Longer word — build it one chunk at a time.":"Use every sound carefully.";$("feedback").className="feedback";$("next").className="next";$("check").disabled=false;drawAnswer();drawPieces();
}
function allPieces(){let q=qs[i];return q.chunks.map((x,n)=>({id:"c"+n,text:x,needed:true})).concat(q.extras.map((x,n)=>({id:"e"+n,text:x,needed:false})))}
let currentPieces=[];
function drawPieces(reset=false){
 if(!currentPieces.length||reset)currentPieces=sh(allPieces());
 let box=$("pieces");box.innerHTML="";
 currentPieces.filter(x=>!selected.some(s=>s.id===x.id)).forEach(x=>{let b=document.createElement("button");b.className="piece";b.textContent=x.text;b.onclick=()=>{if(locked)return;selected.push(x);drawAnswer();drawPieces()};box.appendChild(b)})
}
function drawAnswer(){let a=$("answer");a.innerHTML="";if(!selected.length){a.innerHTML='<span class="placeholder">Your word will appear here</span>';return}selected.forEach((x,n)=>{let b=document.createElement("button");b.className="piece";b.textContent=x.text;b.onclick=()=>{if(locked)return;selected.splice(n,1);drawAnswer();drawPieces()};a.appendChild(b)})}
$("clear").onclick=()=>{if(locked)return;selected=[];drawAnswer();drawPieces()};
$("check").onclick=()=>{if(locked)return;let q=qs[i];let built=selected.map(x=>x.text).join("");let correct=q.chunks.join("");let ok=built===correct;if(ok)score++;locked=true;$("check").disabled=true;let f=$("feedback");f.className="feedback show "+(ok?"good":"bad");f.textContent=ok?"✓ You built it! Read the whole word aloud.":"Not quite. Correct build: "+q.chunks.join(" + ");$("next").textContent=i<qs.length-1?"Next →":"Finish";$("next").className="next show"};
$("next").onclick=()=>{i++;currentPieces=[];if(i<qs.length)render();else $("game").innerHTML=`<div class="done"><div style="font-size:50px">🎉</div><h2>Build It! Complete</h2><div class="score">${score} / ${qs.length}</div><p>${score>=9?"Excellent — you can build unfamiliar words from their sounds.":score>=7?"Strong work. Keep reading each chunk carefully.":"Try another round and build one sound at a time."}</p><button class="play" onclick="location.reload()">New Round ↻</button></div>`};
currentPieces=[];render();
</script></body></html>
