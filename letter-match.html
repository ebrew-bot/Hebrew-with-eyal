<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hebrew Letter Match</title>
<style>
:root{--b:#3157a4;--p:#7357d8;--m:#71809a;--line:#dbe6f4;--g:#e5f7eb;--gl:#79c992}*{box-sizing:border-box}body{margin:0;color:#26324a;font-family:Arial,sans-serif;background:linear-gradient(#eef7ff,#fffaf0)}.page{max-width:720px;margin:auto;padding:12px}.hero{text-align:center;margin-bottom:9px}.k{display:inline-block;padding:5px 10px;border-radius:99px;background:#e8f0ff;color:var(--b);font-size:11px;font-weight:800}h1{margin:6px 0 2px;color:var(--b);font-size:27px}.ht{direction:rtl;color:var(--p);font-weight:800}.sub{font-size:13px;color:var(--m)}.game{background:#fff;border:1px solid var(--line);border-radius:20px;padding:13px}.status{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-bottom:9px;font-size:12px;font-weight:800;color:var(--m)}.stats{display:flex;gap:6px}.pill{padding:5px 8px;border-radius:99px;background:#eef2ff;color:var(--p)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{aspect-ratio:1;border:2px solid #dfe7f3;border-radius:14px;background:linear-gradient(145deg,#5476bd,#7357d8);position:relative;cursor:pointer;padding:0;box-shadow:0 3px 8px rgba(49,87,164,.10);transition:transform .12s ease,border-color .12s ease,background .12s ease}.card:not(.open):not(.matched)::before{content:"א";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.18);font-size:48px;font-weight:900;direction:rtl}.card:not(.open):not(.matched)::after{content:"?";color:white;font-size:27px;font-weight:900;position:absolute;inset:0;display:grid;place-items:center;text-shadow:0 1px 2px rgba(0,0,0,.12)}.card.open,.card.matched{background:white;transform:translateY(-1px)}.card.matched{background:var(--g);border-color:var(--gl);box-shadow:0 2px 7px rgba(67,150,94,.12)}.face{display:none;position:absolute;inset:3px;align-items:center;justify-content:center;text-align:center;font-weight:800}.open .face,.matched .face{display:flex}.hebrew{direction:rtl;color:var(--p);font-size:41px}.english{color:var(--b);font-size:16px;line-height:1.05;padding:3px}.note{text-align:center;color:var(--m);font-size:12px;margin-top:7px}.card:focus-visible{outline:3px solid #f0bd42;outline-offset:2px}@media(hover:hover){.card:not(.open):not(.matched):hover{transform:translateY(-2px);border-color:#b7c7e3}}.done{text-align:center;padding:10px}.done h2{color:var(--b);margin:5px}.codebox{max-width:320px;margin:10px auto;padding:9px;border-radius:16px;background:#f2efff}.label{font-size:11px;font-weight:800;color:var(--p)}.code{direction:rtl;font-size:43px;font-weight:900;color:var(--p)}.play{width:100%;border:0;border-radius:14px;padding:12px;background:var(--b);color:white;font-weight:800;font-size:15px}
@media(max-width:520px){.page{padding:7px}.hero{margin-bottom:6px}h1{font-size:22px}.sub{font-size:11px}.game{padding:8px}.status{font-size:10px;margin-bottom:6px}.board{gap:4px}.card{border-radius:10px}.hebrew{font-size:29px}.english{font-size:11px}.card:not(.open):not(.matched)::after{font-size:22px}.card:not(.open):not(.matched)::before{font-size:38px}}
</style></head><body><main class="page"><header class="hero"><div class="k">HEBREW · MEMORY GAME</div><h1>Hebrew Letter Match</h1><div class="ht">התאמת אותיות</div><div class="sub">Match each Hebrew letter with its English name.</div></header><section class="game" id="game"><div class="status"><div class="stats"><span class="pill" id="matches">Matches: 0 / 8</span><span class="pill" id="moves">Moves: 0</span></div><span>Find all 8 pairs</span></div><div class="board" id="board"></div><div class="note">Tap two cards to find a matching pair.</div></section></main>
<script>
const letters=[["א","Aleph"],["ב","Bet / Vet"],["ג","Gimel"],["ד","Dalet"],["ה","Hey"],["ו","Vav"],["ז","Zayin"],["ח","Chet"],["ט","Tet"],["י","Yud"],["כ","Kaf / Chaf"],["ל","Lamed"],["מ","Mem"],["נ","Nun"],["ס","Samekh"],["ע","Ayin"],["פ","Pay / Fay"],["צ","Tsadee"],["ק","Koof"],["ר","Resh"],["ש","Shin / Sin"],["ת","Tav"]];
function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let first=null,lock=false,moves=0,matched=0;
function start(){let chosen=sh(letters).slice(0,8),deck=[];chosen.forEach((x,i)=>{deck.push({p:i,t:"hebrew",v:x[0]});deck.push({p:i,t:"english",v:x[1]})});let board=document.getElementById("board");sh(deck).forEach(x=>{let b=document.createElement("button");b.type="button";b.className="card";b.dataset.p=x.p;b.setAttribute("aria-label","Face-down card");let f=document.createElement("span");f.className="face "+x.t;f.textContent=x.v;b.appendChild(f);b.onclick=()=>flip(b,x);board.appendChild(b)})}
function flip(c,x){if(lock||c.classList.contains("open")||c.classList.contains("matched"))return;c.classList.add("open");if(!first){first={c,x};return}moves++;document.getElementById("moves").textContent="Moves: "+moves;if(first.x.p===x.p&&first.x.t!==x.t){first.c.className="card matched";c.className="card matched";matched++;document.getElementById("matches").textContent="Matches: "+matched+" / 8";first=null;if(matched===8)setTimeout(done,400)}else{lock=true;let a=first.c;setTimeout(()=>{a.classList.remove("open");c.classList.remove("open");first=null;lock=false},800)}}
function done(){document.getElementById("game").innerHTML='<div class="done"><div style="font-size:45px">🎉</div><h2>You found all 8 matches!</h2><p>Completed in <strong>'+moves+' moves</strong>.</p><div class="codebox"><div class="label">YOUR CODE WORD</div><div class="code">פִּיצָה</div></div><button class="play" onclick="location.reload()">Play Again ↻</button></div>'}
start();
</script></body></html>
