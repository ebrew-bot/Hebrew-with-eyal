<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hebrew Aleph Bet</title>
<style>
:root{
  --blue:#0867d8; --deep:#064cae; --sky:#eaf7ff; --cream:#fffdf7;
  --yellow:#ffd43b; --green:#59c936; --purple:#7a3ee6; --pink:#ff4fa3;
  --ink:#17212b; --muted:#647487;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  font-family:Arial,"Noto Sans Hebrew",sans-serif;
  background:
    radial-gradient(circle at 5% 4%, rgba(255,212,59,.35) 0 45px, transparent 46px),
    radial-gradient(circle at 94% 8%, rgba(122,62,230,.15) 0 55px, transparent 56px),
    linear-gradient(180deg,#eef9ff 0,#fffdf7 240px,#fffdf7 100%);
}
main{max-width:1040px;margin:auto;padding:22px 18px 48px}
h1{
  margin:4px 0 5px;text-align:center;color:var(--deep);
  font-size:clamp(30px,5vw,44px);letter-spacing:-.5px
}
.intro{text-align:center;color:var(--muted);margin:0 0 25px;font-size:16px}
.sec{
  position:relative;margin:22px 0;padding:20px;
  background:rgba(255,255,255,.86);border:1px solid #d9ecfb;border-radius:22px;
  box-shadow:0 7px 22px rgba(16,80,145,.08);overflow:hidden
}
.sec:before{content:"";position:absolute;left:0;top:0;width:7px;height:100%;background:var(--blue)}
.sec:nth-of-type(2):before{background:var(--yellow)}
.sec:nth-of-type(3):before{background:var(--green)}
.sec:nth-of-type(4):before{background:var(--purple)}
.sec:nth-of-type(5):before{background:var(--pink)}
.sec:nth-of-type(6):before{background:#ff8b2c}
h2{color:var(--deep);font-size:21px;margin:0 0 6px;padding-left:4px}
.legend{color:var(--muted);font-size:14px;margin:0 0 14px;padding-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:11px}
.tile{
  min-height:88px;background:#fff;border:2px solid #e0ebf3;border-radius:17px;
  font-size:42px;font-weight:600;cursor:pointer;color:#17212b;
  box-shadow:0 4px 10px rgba(16,70,120,.07);
  transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease,background .12s ease
}
.tile:hover{transform:translateY(-2px);border-color:#8dc7f5;box-shadow:0 7px 14px rgba(16,70,120,.12)}
.tile:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.tile.active{
  border-color:var(--blue);background:#edf7ff;
  box-shadow:0 0 0 3px rgba(8,103,216,.10),0 6px 14px rgba(16,70,120,.12)
}
.info{
  display:none;margin-top:14px;padding:18px 20px;
  background:linear-gradient(135deg,#f0f8ff,#fffdf5);
  border:2px solid #9bcef6;border-radius:18px;
  box-shadow:0 5px 14px rgba(16,70,120,.08)
}
.info.show{display:block}
.row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{
  font-size:64px;min-width:86px;text-align:center;color:var(--deep);
  background:#fff;border-radius:15px;padding:4px 10px;
  box-shadow:0 3px 9px rgba(16,70,120,.08)
}
.name{font-size:21px;font-weight:bold;color:var(--deep)}
.desc{margin-top:7px;line-height:1.45}
.heb{font-size:18px;color:var(--purple)}
@media(max-width:600px){
  main{padding:16px 11px 34px}
  .sec{padding:17px 13px;border-radius:18px}
  .grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{min-height:70px;font-size:34px;border-radius:14px}
  .big{font-size:54px}
}
</style></head>
<body><main><h1>Hebrew Aleph Bet</h1><p class="intro">Tap any letter or vowel to see its name and sound.</p><div id="app"></div></main>
<script>
const sections=[
["Letters · אוֹתִיּוֹת","The complete Hebrew alphabet.",[
["א","Aleph","אָלֶף","Silent unless it carries a vowel like the word אלף."],["ב","Bet / Vet","בֵּית","B with a dot; V without a dot. It’s always a B sound when it’s at the beginning of the word “Bee”."],["ג","Gimel","גִּימֶל","G as in go."],["ד","Dalet","דָּלֶת","D as in dog."],["ה","Hey","הֵא","H as in hat; it can also be silent when used as a vowel."],["ו","Vav","וָו","V as in van; it can also help make O or U vowel sounds."],["ז","Zayin","זַיִן","Z as in zoo."],["ח","Chet","חֵית","A throaty CH sound."],["ט","Tet","טֵית","T as in top."],["י","Yud","יוֹד","Y as in yes; it can also help represent an EE sound."],["כ","Kaf / Chaf","כַּף","K with a dot; CH without a dot."],["ל","Lamed","לָמֶד","L as in lamp."],["מ","Mem","מֵם","M as in mom."],["נ","Nun","נוּן","N as in nose."],["ס","Samekh","סָמֶךְ","S as in sun."],["ע","Ayin","עַיִן","Similar to Aleph in sound and can be silent unless it carries a vowel."],["פ","Pay / Fay","פֵּא","P with a dot; F without a dot."],["צ","Tsadee","צָדִי","TS as in cats."],["ק","Koof","קוֹף","K as in kite."],["ר","Resh","רֵישׁ","R as in Rainbow."],["ש","Shin / Sin","שִׁין","SH with the dot on the right; S with the dot on the left."],["ת","Tav","תָּו","T as in top."]]],
["Final Letters · אוֹתִיּוֹת סופיות","These forms appear only at the end of a word.",[
["ך","Final Chaf","כַף סוֹפִית","Final form of the letter כ; usually makes the CH sound and not the K sound."],["ם","Final Mem","מֵם סוֹפִית","Final form of מ; M."],["ן","Final Nun","נוּן סוֹפִית","Final form of נ; N."],["ף","Final Fay","פֵא סוֹפִית","Final form of the letter פ; makes the F sound and not the P sound."],["ץ","Final Tsadee","צָדִי סוֹפִית","Final form of צ; TS."]]],
["Letters with Two Sounds · אוֹתִיּוֹת עִם שְׁנֵי צְלִילִים","The dot or its position changes the sound.",[
["בּ / ב","Bet / Vet","בֵּית","בּ = B • ב = V"],["כּ / כ","Kaf / Chaf","כַּף","כּ = K • כ = CH"],["פּ / פ","Pay / Fay","פֵּא","פּ = P • פ = F"],["שׁ / שׂ","Shin / Sin","שִׁין","שׁ = SH • שׂ = S"]]],
["Letters as Vowels · אוֹתִיּוֹת מְיֻחָדוֹת","These letters can also help represent vowel sounds.",[
["א","Aleph","אָלֶף","Can carry a vowel and help mark vowel structure."],["ה","Hey","הֵא","At the end of many words, ה can help indicate a vowel ending."],["ו","Vav","וָו","וֹ commonly represents O; וּ commonly represents U. It can also be V."],["י","Yud","יוֹד","Often helps represent an EE / I sound. It can also be Y."]]],
["Vowels · נִקּוּד","Vowel marks are shown with ב so they are easy to see.",[
["בַּ","Patach","פַּתָּח","AH sound."],["בָּ","Kamatz","קָמָץ","Usually AH in modern Hebrew."],["בֶּ","Segol","סֶגּוֹל","EH sound."],["בֵּ","Tzere","צֵירֵי","EH sound."],["בִּ","Hirik","חִירִיק","EE sound."],["בֹּ","Holam","חוֹלָם","OH sound."],["בֻּ","Kubutz","קֻבּוּץ","OO sound."],["בּוּ","Shuruk","שׁוּרוּק","OO sound, written with Vav and a dot."],["בְּ","Shva","שְׁוָא","Can be silent or a very short vowel depending on the word."]]],
["Special Letters & Vowels · יוֹצְאֵי דֹּפֶן","Special cases that may look or sound different from the usual pattern.",[
["אָ","Kamatz Katan","קָמָץ קָטָן","Looks like a regular Kamatz, but makes an O sound instead of an AH sound. Example: אָנִיָּה (ship)."],
["תּ","Tav with Dagesh","תּ","The dot changes how the letter looks, but does not change its T sound."],
["הּ","Hey with Dagesh","הּ","The dot changes how the letter looks, but does not change its H sound."]
]]
];
const app=document.getElementById("app");
sections.forEach((s,si)=>{const sec=document.createElement("section");sec.className="sec";sec.innerHTML=`<h2>${si+1}. ${s[0]}</h2><p class="legend">${s[1]}</p><div class="grid"></div><div class="info"></div>`;const grid=sec.querySelector(".grid"),info=sec.querySelector(".info");s[2].forEach(x=>{const b=document.createElement("button");b.className="tile";b.type="button";b.textContent=x[0];b.onclick=()=>{grid.querySelectorAll(".tile").forEach(t=>t.classList.remove("active"));b.classList.add("active");info.innerHTML=`<div class="row"><div class="big" dir="rtl">${x[0]}</div><div><div class="name">${x[1]} <span class="heb" dir="rtl">· ${x[2]}</span></div><div class="desc">${x[3]}</div></div></div>`;info.classList.add("show")};grid.appendChild(b)});app.appendChild(sec)});
</script></body></html>
