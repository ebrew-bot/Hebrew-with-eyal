<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vowel Challenge · Mid-level Hebrew</title>
<style>
:root{--blue:#3157a4;--blue2:#5476bd;--purple:#7357d8;--ink:#26324a;--muted:#71809a;--cream:#fffaf0;--sky:#eef7ff;--line:#dbe6f4;--green:#e5f7eb;--greenline:#79c992;--red:#fff0f0;--redline:#e69696}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;background:linear-gradient(180deg,var(--sky),#f8fbff 48%,var(--cream))}
.page{max-width:760px;margin:auto;padding:10px 16px 24px}.hero{text-align:center;margin-bottom:10px}
.kicker{display:inline-block;padding:5px 12px;border-radius:999px;background:#e8f0ff;color:var(--blue);font-size:12px;font-weight:800}
h1{margin:6px 0 2px;color:var(--blue);font-size:30px}.he-title{direction:rtl;color:var(--purple);font-weight:800;font-size:19px}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.game{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:14px 18px;box-shadow:0 10px 28px rgba(49,87,164,.09)}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:800}.badge{background:#eeeaff;color:var(--purple);padding:5px 10px;border-radius:999px}
.track{height:9px;background:#edf1f7;border-radius:999px;margin:8px 0 12px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--purple));transition:width .25s}
.question{text-align:center;background:#f8fbff;border:1px solid #e6edf8;border-radius:19px;padding:14px 10px;margin-bottom:10px}.prompt{font-size:15px;font-weight:800;color:var(--muted)}
.target{color:var(--blue);font-size:24px;font-weight:900;margin-top:5px}.word{direction:rtl;color:var(--purple);font-size:52px;font-weight:900;line-height:1.45;margin:5px 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{min-height:76px;border:2px solid #e2e9f4;border-radius:17px;background:#fff;color:var(--purple);font-size:37px;font-weight:900;cursor:pointer;direction:rtl}
.choice.text{direction:ltr;color:var(--blue);font-size:19px}.choice:hover{border-color:#aebfe0;transform:translateY(-1px)}.choice.correct,.choice.reveal{background:var(--green);border-color:var(--greenline)}.choice.wrong{background:var(--red);border-color:var(--redline)}.choice:disabled{cursor:default}
.feedback{display:none;margin-top:9px;padding:9px 12px;border-radius:15px;text-align:center;font-size:14px;font-weight:800}.feedback.show{display:block}.feedback.good{background:var(--green)}.feedback.bad{background:var(--red)}
.next{display:none;width:100%;border:0;border-radius:15px;margin-top:8px;padding:11px;background:var(--blue);color:white;font-size:16px;font-weight:800;cursor:pointer}.next.show{display:block}
.done{text-align:center;padding:18px 5px 8px}.done h2{color:var(--blue);font-size:27px;margin:8px}.done p{color:var(--muted)}.score{font-size:46px;font-weight:900;color:var(--purple);margin:8px}.play{width:100%;border:0;border-radius:15px;padding:13px;background:var(--blue);color:#fff;font-weight:800;font-size:16px}
.note{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}
@media(max-width:520px){.page{padding:8px 10px 20px}.game{padding:12px}.word{font-size:44px}.choices{grid-template-columns:1fr}.choice{min-height:61px;font-size:32px}h1{font-size:27px}}
</style></head>
<body><main class="page">
<header class="hero"><div class="kicker">MID-LEVEL · DECODING</div><h1>Vowel Challenge</h1><div class="he-title">אתגר הניקוד</div><div class="sub">Small vowel changes can change the whole sound.</div></header>
<section class="game" id="game">
<div class="status"><span id="count"></span><span class="badge" id="level"></span></div><div class="track"><div class="fill" id="fill"></div></div>
<div class="question"><div class="prompt" id="prompt"></div><div class="target" id="target"></div><div class="word" id="word"></div></div>
<div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next →</button>
<div class="note">Read the vowels carefully. Similar-looking choices are intentional.</div>
</section></main>
<script>
const bank=[
{tier:1,type:"pickHeb",prompt:"Which Hebrew says",target:"MA",answer:"מַ",choices:["מַ","מֶ","מִ","מֻ"]},
{tier:1,type:"pickHeb",prompt:"Which Hebrew says",target:"LO",answer:"לוֹ",choices:["לוֹ","לִי","לָ","לוּ"]},
{tier:1,type:"pickHeb",prompt:"Which Hebrew says",target:"SHU",answer:"שׁוּ",choices:["שׁוּ","שׁוֹ","שִׁ","שֶׁ"]},
{tier:1,type:"pickText",prompt:"How do you read this?",word:"נֶ",answer:"NE",choices:["NE","NA","NI","NO"]},

{tier:2,type:"pickHeb",prompt:"Which one says",target:"MELON",answer:"מֶלוֹן",choices:["מֶלוֹן","מָלוֹן","מִלוֹן","מֶלוּן"]},
{tier:2,type:"pickHeb",prompt:"Which one says",target:"SHALIM",answer:"שָׁלִים",choices:["שָׁלִים","שֶׁלִים","שָׁלוֹם","שָׁלֵם"]},
{tier:2,type:"pickText",prompt:"Decode the vowels:",word:"גּוּרֶם",answer:"GUREM",choices:["GUREM","GOREM","GURAM","GIRAM"]},
{tier:2,type:"pickText",prompt:"Decode the vowels:",word:"תּוֹלִי",answer:"TOLI",choices:["TOLI","TULI","TALI","TELI"]},

{tier:3,type:"pickHeb",prompt:"Choose the exact vowel pattern for",target:"CHALUMAH",answer:"חֲלוּמָה",choices:["חֲלוּמָה","חֲלוֹמָה","חֶלוּמָה","חֲלוּמֶה"]},
{tier:3,type:"pickText",prompt:"Read every vowel:",word:"סְגָרוּנָה",answer:"SGARUNAH",choices:["SGARUNAH","SEGARUNAH","SGORUNAH","SGARONAH"]},
{tier:3,type:"pickHeb",prompt:"Which one says",target:"PLUMARIM",answer:"פְּלוּמָרִים",choices:["פְּלוּמָרִים","פֶּלוּמָרִים","פְּלוֹמָרִים","פְּלוּמֶרִים"]},
{tier:3,type:"pickText",prompt:"Read it in chunks:",word:"צְמוּרָקֶת",answer:"TZMURAKET",choices:["TZMURAKET","TZEMURAKET","TZMORAKET","TZMURAKAT"]},

{tier:4,type:"pickHeb",prompt:"Final challenge — choose",target:"KRAFNU-LIM",answer:"כְּרַפְנוּלִים",choices:["כְּרַפְנוּלִים","כֶּרַפְנוּלִים","כְּרָפְנוֹלִים","כְּרַפְנוּלֵים"]},
{tier:4,type:"pickText",prompt:"Final challenge — decode:",word:"מִתְרוֹקְשִׁים",answer:"MITROKSHIM",choices:["MITROKSHIM","METROKSHIM","MITROKESHIM","MITROKSHAM"]},
{tier:4,type:"pickHeb",prompt:"Final challenge — choose",target:"SHLUMVARIT",answer:"שְׁלוּמְבָרִית",choices:["שְׁלוּמְבָרִית","שֶׁלוּמְבָרִית","שְׁלוֹמְבָרִית","שְׁלוּמְבֶרִית"]},
{tier:4,type:"pickText",prompt:"Final challenge — decode:",word:"פְּרָנוּמֶלֶת",answer:"PRANUMELET",choices:["PRANUMELET","PERANUMELET","PRANOMELET","PRANUMALAT"]}
];
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function round(){let r=[];[1,2,3,4].forEach(t=>r.push(...sh(bank.filter(x=>x.tier===t)).slice(0,t<3?3:2)));return r}
let qs=round(),i=0,score=0,locked=false;const $=x=>document.getElementById(x);const labels={1:"Warm Up",2:"Level Up",3:"Challenge",4:"Final Challenge"};
function render(){locked=false;let q=qs[i];$("count").textContent=`${i+1} of ${qs.length}`;$("level").textContent=labels[q.tier];$("fill").style.width=`${i/qs.length*100}%`;$("prompt").textContent=q.prompt;$("target").textContent=q.target||"";$("word").textContent=q.word||"";$("feedback").className="feedback";$("next").className="next";let c=$("choices");c.innerHTML="";
sh(q.choices).forEach(x=>{let b=document.createElement("button");b.className="choice"+(q.type==="pickText"?" text":"");b.textContent=x;b.onclick=()=>pick(b,x,q);c.appendChild(b)})}
function pick(b,x,q){if(locked)return;locked=true;let ok=x===q.answer;if(ok)score++;document.querySelectorAll(".choice").forEach(z=>{z.disabled=true;if(z.textContent===q.answer)z.classList.add(z===b?"correct":"reveal")});if(!ok)b.classList.add("wrong");let f=$("feedback");f.className="feedback show "+(ok?"good":"bad");f.textContent=ok?"✓ Correct — careful vowel reading!":"Look again at the vowel marks. Correct: "+q.answer;$("next").textContent=i<qs.length-1?"Next →":"Finish";$("next").className="next show"}
$("next").onclick=()=>{i++;if(i<qs.length)render();else $("game").innerHTML=`<div class="done"><div style="font-size:50px">🎉</div><h2>Vowel Challenge Complete!</h2><div class="score">${score} / ${qs.length}</div><p>${score>=9?"Excellent vowel reading.":score>=7?"Nice work — those small vowel changes matter.":"Try another round and slow down on each vowel."}</p><button class="play" onclick="location.reload()">New Round ↻</button></div>`};render();
</script></body></html>
