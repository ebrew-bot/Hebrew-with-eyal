<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beginners Hebrew — Lesson 2</title>
<style>
:root{--ink:#203238;--blue:#4fc3d0;--orange:#ff7655;--green:#79c98b;--yellow:#ffd85a;--purple:#9b87d4;--bg:#f5f1e8}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:920px;margin:auto;min-height:100vh;padding:24px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 5px 18px #0002;margin:14px 0;min-height:500px}
h2{text-align:center;margin:8px 0 16px;font-size:30px}.sub{text-align:center;font-size:20px;color:#56666b;margin:0 0 22px}
.he{font-family:"Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;direction:rtl;font-size:60px;font-weight:700}.big{text-align:center;font-size:78px;margin:18px}
.row,.choices,.letters,.tiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:16px;padding:15px 22px;font-size:20px;font-weight:700;cursor:pointer;background:var(--blue);color:#17373b;box-shadow:0 3px 0 #0002;transition:.12s}
button:hover{transform:translateY(-2px);box-shadow:0 5px 0 #0002}button:active{transform:translateY(1px)}button:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.orange{background:var(--orange);color:#fff}.secondary{background:#eee}.purple{background:var(--purple);color:#fff}
.choice{min-width:145px;background:#fff;border:3px solid #dce5e7}.choice:hover{background:#eefbfc;border-color:var(--blue)}
.choice.good,.choice.good:hover{background:#dff5e5;border-color:var(--green)}.choice.bad,.choice.bad:hover{background:#ffe1db;border-color:var(--orange)}.choice:disabled{cursor:default;opacity:1}
.letter{width:120px;height:120px;background:#fff;border:4px solid #e1e7e8;font-size:64px;padding:0}.letter.found{background:#dff5e5;border-color:var(--green)}
.progress{height:12px;background:#e6e6e6;border-radius:99px;overflow:hidden;margin:12px 0 25px}.progress div{height:100%;background:var(--blue)}
.feedback{text-align:center;min-height:42px;font-size:21px;font-weight:700;margin:16px}.note{background:#fff5ca;border-radius:15px;padding:14px 18px;font-size:18px;text-align:center}
.hidden{display:none!important}.score{font-size:72px;text-align:center;font-weight:800;color:#4a9ca5}.piece{background:#fff3c4;border:3px solid #f0c94d;font-size:52px;min-width:110px}
.build{min-height:115px;border:3px dashed #c9d3d5;border-radius:18px;padding:12px;display:flex;flex-direction:row-reverse;gap:10px;justify-content:center;align-items:center;margin:16px auto;max-width:500px}
.token{font-size:62px;font-weight:700;direction:rtl}.sectionTag{text-align:center;font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6d7a7e;margin-bottom:10px}
@media(max-width:650px){#app{padding:10px}.card{padding:18px;min-height:460px}h2{font-size:27px}.he{font-size:50px}.letter{width:90px;height:90px;font-size:50px}.choice{min-width:115px}.big{font-size:62px}}
</style></head>
<body><main id="app"></main>
<script>
const app=document.getElementById('app');
let stage=0, si=0, ri=0, qi=0, score=0, locked=false, findRound=0, findRemaining=0, built=[];
const soundQs=[
 {q:'א',prompt:'What sound does this letter make on its own?',a:'Silent',c:['Silent','A','B','M']},
 {q:'ע',prompt:'What sound does this letter make on its own?',a:'Silent',c:['Silent','A','B','SH']},
 {q:'בּ',prompt:'What sound does Bet make?',a:'B',c:['B','V','A','M']},
 {q:'אַ',prompt:'What vowel sound do you see?',a:'A',c:['A','B','M','SH']},
 {q:'עַ',prompt:'What vowel sound do you see?',a:'A',c:['A','B','M','SH']},
 {q:'בַּ',prompt:'Put Bet + the vowel together. What do you read?',a:'BA',c:['BA','A','MA','SH']}
];
const readQs=[['אַ','A'],['עַ','A'],['בַּ','BA'],['אַבָּא','ABA']];
const challengeQs=[
 {p:'Which letter is Alef?',opts:['א','ע','בּ'],ok:['א']},
 {p:'Which letter is Ayin?',opts:['בּ','א','ע'],ok:['ע']},
 {p:'Which letter is Bet?',opts:['ע','בּ','א'],ok:['בּ']},
 {p:'What sound does Alef make on its own?',display:'א',opts:['Silent','A','B'],ok:['Silent']},
 {p:'What sound does Ayin make on its own?',display:'ע',opts:['Silent','A','B'],ok:['Silent']},
 {p:'What sound does Bet make?',display:'בּ',opts:['B','V','A'],ok:['B']},
 {p:'What vowel sound do you see?',display:'אַ',opts:['A','B','MA'],ok:['A']},
 {p:'What vowel sound do you see?',display:'עַ',opts:['A','B','SH'],ok:['A']},
 {p:'Which one says ABA?',opts:['אַבָּא','אַבָּע','מָשׁ'],ok:['אַבָּא','אַבָּע']},
 {p:'Which letter belongs only at the END of a word?',opts:['מ','ם','ע'],ok:['ם']}
];
function shell(title,subtitle,body,progress=0,tag='Lesson 2'){
 app.innerHTML=`<div class="card"><div class="sectionTag">${tag}</div><h2>${title}</h2>${subtitle?`<div class="sub">${subtitle}</div>`:''}
 ${progress?`<div class="progress"><div style="width:${progress}%"></div></div>`:''}${body}</div>`;
}
function next(){stage++;render()}
function render(){[intro,meet,silentRule,findIt,sounds,whichSays,buildWord,readIt,lessonChallengeIntro,lessonChallenge,reviewIntro,reviewChallenge][stage]()}
function intro(){shell("Beginners — Lesson 2","א • ע • ב",`<div class="big he">אַבָּא</div><p class="sub">Three new letters — plus practice with what you already know.</p><div class="row"><button class="orange" onclick="next()">Start Lesson</button></div>`)}
function meet(){shell("1. Meet the New Letters","Tap each letter to learn it.",`
<div class="letters"><button class="letter" onclick="learn(this,'Alef','silent on its own')">א</button><button class="letter" onclick="learn(this,'Ayin','silent on its own')">ע</button><button class="letter" onclick="learn(this,'Bet','B')">בּ</button></div>
<div id="learn" class="feedback">Choose a letter.</div><div class="row"><button onclick="next()">Next</button></div>`,12)}
function learn(el,n,s){document.getElementById('learn').textContent=`${n} • ${s}`;document.querySelectorAll('.letter').forEach(x=>x.style.borderColor='#e1e7e8');el.style.borderColor='#4fc3d0'}
function silentRule(){shell("2. Letter Hint","Alef א and Ayin ע are silent on their own.",`
<div class="note"><b>א</b> and <b>ע</b> are silent. When a vowel appears with them, the <b>vowel mark</b> supplies the sound.</div>
<div class="choices" style="margin-top:24px"><button class="choice he" data-ok="1">אַ</button><button class="choice he" data-ok="1">עַ</button><button class="choice he" data-ok="0">בַּ</button></div>
<div id="fb" class="feedback">Tap a combination where the letter is silent and you hear the vowel.</div><div class="row"><button id="sn" class="hidden" onclick="next()">Next</button></div>`,23);
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.ok==='1'){b.classList.add('good');document.getElementById('fb').textContent='Correct — the letter is silent; the vowel supplies the sound.';document.getElementById('sn').classList.remove('hidden')}else{b.classList.add('bad');document.getElementById('fb').textContent='Bet has its own B sound.'}})}
function findIt(){findRound=0;renderFind()}
function renderFind(){const targets=[['א','Alef'],['ע','Ayin'],['ב','Bet']];if(findRound>=targets.length){next();return}const [target,name]=targets[findRound];findRemaining=3;
shell("3. Find It!",`Find every ${name} ${target}.`,`<div class="letters" id="grid"></div><div id="fb" class="feedback">Find 3.</div><div class="row"><button id="fn" class="hidden">Next</button></div>`,34);
let distractors=['א','ע','ב','מ','ש','ם'].filter(v=>v!==target);
let vals=[target,target,target];
while(vals.length<12) vals.push(distractors[Math.floor(Math.random()*distractors.length)]);
vals.sort(()=>Math.random()-.5);
vals.forEach(v=>{let b=document.createElement('button');b.className='letter';b.textContent=v;b.onclick=()=>{if(b.classList.contains('found'))return;if(v===target){b.classList.add('found');findRemaining--;document.getElementById('fb').textContent=findRemaining?`Great! Find ${findRemaining} more.`:'You found them all!';if(!findRemaining)document.getElementById('fn').classList.remove('hidden')}else document.getElementById('fb').textContent=`Try again — find ${target}.`};document.getElementById('grid').appendChild(b)});
document.getElementById('fn').onclick=()=>{findRound++;renderFind()}}
function sounds(){if(si>=soundQs.length){si=0;next();return}let x=soundQs[si];shell("4. Letters & Vowels",x.prompt,`<div class="big he">${x.q}</div><div class="choices">${x.c.map(c=>`<button class="choice">${c}</button>`).join('')}</div><div id="fb" class="feedback"></div>`,45);
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.textContent===x.a){b.classList.add('good');document.getElementById('fb').textContent='Correct!';setTimeout(()=>{si++;sounds()},650)}else{b.classList.add('bad');document.getElementById('fb').textContent='Try again.'}})}
function whichSays(){shell("5. Which One Says…?","Which one says ABA?",`
<div class="choices"><button class="choice he" data-ok="1">אַבָּא</button><button class="choice he" data-ok="1">אַבָּע</button><button class="choice he" data-ok="0">עַבָּם</button></div>
<div id="fb" class="feedback"></div><div class="row"><button id="wn" class="hidden" onclick="next()">Next</button></div>`,56);
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.ok==='1'){b.classList.add('good');document.getElementById('fb').textContent='Correct — we are decoding sound, so both ABA forms count.';document.getElementById('wn').classList.remove('hidden')}else{b.classList.add('bad');document.getElementById('fb').textContent='Try again. Read from right to left.'}})}
function buildWord(){built=[];shell("6. Build the Word","Build ABA from right to left.",`
<div class="note">Start on the <b>right</b>. Add each new piece to the <b>left</b>.</div><div id="build" class="build"><span style="color:#9aa7aa;font-size:18px">Start here →</span></div>
<div class="tiles"><button class="piece he" data-piece="א">א</button><button class="piece he" data-piece="בָּ">בָּ</button><button class="piece he" data-piece="אַ">אַ</button></div>
<div id="fb" class="feedback">Tap אַ first.</div><div class="row"><button class="secondary" onclick="buildWord()">Reset</button><button id="bn" class="hidden" onclick="next()">Next</button></div>`,66);
document.querySelectorAll('.piece').forEach(b=>b.onclick=()=>addPiece(b))}
function addPiece(btn){let v=btn.dataset.piece,expected=['אַ','בָּ','א'];if(v!==expected[built.length]){document.getElementById('fb').textContent=built.length===0?'Start on the right with אַ.':'Not yet — add the next sound to the left.';return}built.push(v);btn.disabled=true;let box=document.getElementById('build');box.innerHTML='';built.forEach(x=>{let s=document.createElement('span');s.className='token he';s.textContent=x;box.appendChild(s)});document.getElementById('fb').textContent=built.length<3?'Good. Keep building to the left.':'Great! You built אַבָּא from right to left.';if(built.length===3)document.getElementById('bn').classList.remove('hidden')}
function readIt(){if(ri>=readQs.length){ri=0;next();return}let x=readQs[ri];shell("7. Read It!","Say it out loud before you check.",`<div class="big he">${x[0]}</div><div id="rev" class="feedback">Ready?</div><div class="row"><button onclick="document.getElementById('rev').textContent='${x[1]}'">Show Me</button><button onclick="ri++;readIt()">Next</button></div>`,76)}
function lessonChallengeIntro(){shell("Lesson 2 Challenge","10 questions using Lesson 2 and a little review.",`<p class="sub">א • ע • ב • plus ש מ ם</p><div class="row"><button class="orange" onclick="qi=0;score=0;next()">Start Challenge</button></div>`,86)}
function lessonChallenge(){runChallenge(challengeQs,"Lesson 2 Challenge",()=>{stage=10;render()})}
function runChallenge(qs,title,done){if(qi>=qs.length){finishChallenge(title,qs.length,done);return}locked=false;let x=qs[qi];shell(`${title} — ${qi+1} of ${qs.length}`,`Score: ${score}`,`${x.display?`<div class="big he">${x.display}</div>`:''}<div class="sub">${x.p}</div><div class="choices" id="answers"></div><div id="fb" class="feedback"></div>`,90+Math.floor(qi/qs.length*10),title);
let box=document.getElementById('answers');x.opts.forEach(opt=>{let b=document.createElement('button');b.className='choice'+(/[א-ת]/.test(opt)?' he':'');b.textContent=opt;b.onclick=()=>{if(locked)return;locked=true;let good=x.ok.includes(opt);document.querySelectorAll('#answers .choice').forEach(y=>y.disabled=true);if(good){score++;b.classList.add('good');document.getElementById('fb').textContent='Correct!'}else{b.classList.add('bad');document.getElementById('fb').textContent='Not quite.';document.querySelectorAll('#answers .choice').forEach(y=>{if(x.ok.includes(y.textContent))y.classList.add('good')})}setTimeout(()=>{qi++;runChallenge(qs,title,done)},1000)};box.appendChild(b)})}
function finishChallenge(title,total,done){shell("🎉 Challenge Complete!","Nice work!",`<div class="score">${score}/${total}</div><div class="row"><button id="cont">Continue</button></div>`,100,title);document.getElementById('cont').onclick=done}
function reviewIntro(){shell("Lessons 1 + 2 Review","Now mix everything you've learned.",`<div class="big he">ש מ ם א ע בּ</div><p class="sub">Letters • vowels • decoding • final Mem • right-to-left reading</p><div class="row"><button class="purple" onclick="qi=0;score=0;next()">Start Review</button></div>`,0,"Cumulative Review")}
const reviewQs=[
 {p:'Which is Final Mem?',opts:['מ','ם','ע'],ok:['ם']},
 {p:'Which letter is Shin?',opts:['בּ','שׁ','א'],ok:['שׁ']},
 {p:'Which letter is Alef?',opts:['ע','א','מ'],ok:['א']},
 {p:'Which letter is Ayin?',opts:['א','ע','בּ'],ok:['ע']},
 {p:'What sound does Alef make on its own?',display:'א',opts:['Silent','A','B'],ok:['Silent']},
 {p:'What sound does Ayin make on its own?',display:'ע',opts:['Silent','A','B'],ok:['Silent']},
 {p:'What sound does Bet make?',display:'בּ',opts:['B','V','A'],ok:['B']},
 {p:'What sound?',display:'מָ',opts:['MA','BA','SHA'],ok:['MA']},
 {p:'Put Bet + the vowel together. What do you read?',display:'בַּ',opts:['BA','A','MA'],ok:['BA']},
 {p:'What vowel sound do you see?',display:'אַ',opts:['A','B','SH'],ok:['A']},
 {p:'Which one says SHAM?',opts:['שָׁם','שָׁמ','מָשׁ'],ok:['שָׁם','שָׁמ']},
 {p:'Which one says ABA?',opts:['אַבָּא','אַבָּע','מָשׁ'],ok:['אַבָּא','אַבָּע']},
 {p:'Hebrew is read…',opts:['Right to left','Left to right'],ok:['Right to left']}
];
function reviewChallenge(){runChallenge(reviewQs,"Lessons 1 + 2 Review",()=>{shell("⭐ Review Complete!","You finished Lessons 1 + 2.",`<div class="score">${score}/${reviewQs.length}</div><div class="row"><button onclick="location.reload()">Start Over</button></div>`,100,"Cumulative Review")})}
render();
</script></body></html>
