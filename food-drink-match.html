<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food & Drinks · Match the Picture</title>
<style>
:root{
  --blue:#3157a4;
  --blue2:#5476bd;
  --purple:#7357d8;
  --ink:#26324a;
  --muted:#71809a;
  --cream:#fffaf0;
  --sky:#eef7ff;
  --line:#dbe6f4;
  --green:#e5f7eb;
  --green-line:#79c992;
  --red:#fff0f0;
  --red-line:#e69696;
  --yellow:#fff3c8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 8% 9%,rgba(115,87,216,.10) 0 46px,transparent 47px),
    radial-gradient(circle at 92% 17%,rgba(255,196,77,.18) 0 58px,transparent 59px),
    linear-gradient(180deg,var(--sky) 0%,#f8fbff 48%,var(--cream) 100%);
}
.page{max-width:760px;margin:0 auto;padding:22px 16px 48px}
.hero{text-align:center;margin:4px auto 20px}
.kicker{
  display:inline-block;
  padding:7px 13px;
  border-radius:999px;
  background:#e8f0ff;
  color:var(--blue);
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
}
h1{
  margin:10px 0 5px;
  color:var(--blue);
  font-size:32px;
  line-height:1.05;
}
.hebrew-title{
  direction:rtl;
  color:var(--purple);
  font-weight:800;
  font-size:19px;
  margin-bottom:6px;
}
.subtitle{font-size:14px;color:var(--muted)}

.game-card{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.96);
  border:1.5px solid var(--line);
  border-radius:24px;
  padding:20px;
  box-shadow:0 10px 28px rgba(49,87,164,.09);
}
.game-card:before{
  content:"";
  position:absolute;
  width:90px;height:90px;border-radius:50%;
  background:rgba(255,211,94,.15);
  right:-35px;top:-38px;
}
.status{
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:13px;
  font-weight:800;
}
.activity{
  background:#eef2ff;
  color:var(--purple);
  border:1px solid #ded7ff;
  padding:5px 10px;
  border-radius:999px;
}
.track{
  height:9px;
  background:#edf1f7;
  border-radius:999px;
  margin:12px 0 22px;
  overflow:hidden;
}
.fill{
  height:100%;
  width:0;
  border-radius:999px;
  background:linear-gradient(90deg,var(--blue2),var(--purple));
  transition:width .25s ease;
}
.question{
  text-align:center;
  background:#f8fbff;
  border:1px solid #e6edf8;
  border-radius:19px;
  padding:17px 12px 18px;
  margin-bottom:15px;
}
.prompt{
  font-size:14px;
  font-weight:700;
  color:var(--muted);
}
.word{
  direction:rtl;
  color:var(--purple);
  font-weight:800;
  font-size:58px;
  line-height:1.2;
  margin-top:8px;
}
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.choice{
  min-height:116px;
  border:2px solid #e2e9f4;
  border-radius:19px;
  background:#fff;
  font-size:51px;
  cursor:pointer;
  box-shadow:0 3px 9px rgba(49,87,164,.05);
  transition:transform .12s,border-color .12s,background .12s;
}
.choice:hover{transform:translateY(-2px);border-color:#aebfe0}
.choice:active{transform:scale(.98)}
.choice.correct,.choice.reveal{background:var(--green);border-color:var(--green-line)}
.choice.wrong{background:var(--red);border-color:var(--red-line)}
.choice:disabled{cursor:default}

.feedback{
  display:none;
  margin-top:15px;
  padding:13px 14px;
  border-radius:15px;
  text-align:center;
  font-size:15px;
  font-weight:800;
}
.feedback.show{display:block}
.feedback.good{background:var(--green);border:1px solid #b9e7c7}
.feedback.bad{background:var(--red);border:1px solid #f0c3c3}

.next{
  display:none;
  width:100%;
  border:0;
  border-radius:15px;
  margin-top:13px;
  padding:14px 16px;
  background:var(--blue);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 12px rgba(49,87,164,.18);
}
.next.show{display:block}
.next:hover{filter:brightness(.98)}

.done{text-align:center;padding:18px 5px 8px}
.done-icon{font-size:56px}
.done h2{color:var(--blue);font-size:27px;margin:8px 0 5px}
.done p{color:var(--muted);margin:0 0 18px}
.play-again{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  background:var(--blue);
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

@media(max-width:520px){
  .page{padding:14px 11px 34px}
  .hero{margin-bottom:14px}
  h1{font-size:27px}
  .hebrew-title{font-size:17px}
  .game-card{padding:14px;border-radius:21px}
  .question{padding:14px 8px 15px}
  .word{font-size:47px}
  .choices{gap:9px}
  .choice{min-height:96px;font-size:44px;border-radius:16px}
  .status{font-size:12px}
}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="kicker">Food &amp; Drinks</div>
    <h1>Match the Picture</h1>
    <div class="hebrew-title">אוכל ושתייה</div>
    <div class="subtitle">Read the Hebrew word and choose the matching picture.</div>
  </header>

  <section class="game-card" id="game">
    <div class="status">
      <span id="count">1 of 6</span>
      <span class="activity">Picture Match</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>

    <div class="question">
      <div class="prompt">Which picture matches this word?</div>
      <div class="word" id="word"></div>
    </div>

    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next">Next →</button>
  </section>
</main>

<script>
const vocab=[
 {heb:"פִּיצָה",answer:"Pizza",icon:"🍕",choices:[["Pizza","🍕"],["Sushi","🍣"],["Pasta","🍝"],["Milkshake","🥤"]]},
 {heb:"פַּסְטָה",answer:"Pasta",icon:"🍝",choices:[["Pizza","🍕"],["Pasta","🍝"],["Chocolate","🍫"],["Sushi","🍣"]]},
 {heb:"סוּשִׁי",answer:"Sushi",icon:"🍣",choices:[["Milkshake","🥤"],["Pasta","🍝"],["Sushi","🍣"],["Pizza","🍕"]]},
 {heb:"שׁוֹקוֹלָד",answer:"Chocolate",icon:"🍫",choices:[["Chocolate","🍫"],["Sushi","🍣"],["Pizza","🍕"],["Pasta","🍝"]]},
 {heb:"מִילְקְשֵׁייק",answer:"Milkshake",icon:"🥤",choices:[["Pasta","🍝"],["Chocolate","🍫"],["Pizza","🍕"],["Milkshake","🥤"]]},
 {heb:"בַּנָנָה",answer:"Banana",icon:"🍌",choices:[["Banana","🍌"],["Pizza","🍕"],["Sushi","🍣"],["Milkshake","🥤"]]}
];

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}

let order=shuffle(vocab),index=0,locked=false,score=0;
const el=id=>document.getElementById(id);

function render(){
  locked=false;
  const item=order[index];
  el("count").textContent=(index+1)+" of "+order.length;
  el("fill").style.width=(index/order.length*100)+"%";
  el("word").textContent=item.heb;
  el("feedback").className="feedback";
  el("feedback").textContent="";
  el("next").className="next";

  const choices=el("choices");
  choices.innerHTML="";
  shuffle(item.choices).forEach(([name,icon])=>{
    const button=document.createElement("button");
    button.className="choice";
    button.type="button";
    button.textContent=icon;
    button.dataset.name=name;
    button.setAttribute("aria-label",name);
    button.addEventListener("click",()=>pick(button,item));
    choices.appendChild(button);
  });
}

function pick(button,item){
  if(locked)return;
  locked=true;
  const correct=button.dataset.name===item.answer;
  if(correct)score++;

  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    if(b.dataset.name===item.answer){
      b.classList.add(b===button?"correct":"reveal");
    }
  });

  if(!correct)button.classList.add("wrong");

  const feedback=el("feedback");
  feedback.className="feedback show "+(correct?"good":"bad");
  feedback.textContent=correct
    ? "✓ Yes! "+item.heb+" = "+item.answer+" "+item.icon
    : item.heb+" = "+item.answer+" "+item.icon;

  const next=el("next");
  next.textContent=index<order.length-1?"Next →":"Finish";
  next.className="next show";
}

el("next").addEventListener("click",()=>{
  index++;
  if(index<order.length){
    render();
  }else{
    el("game").innerHTML=
      '<div class="done">'+
      '<div class="done-icon">🎉</div>'+
      '<h2>Great job!</h2>'+
      '<p>You matched <strong>'+score+' of '+order.length+'</strong> correctly.</p>'+
      '<button class="play-again" type="button" onclick="location.reload()">Play Again ↻</button>'+
      '</div>';
  }
});

render();
</script>
</body>
</html>
